name: Build macOS Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v1.0.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Release app
        run: |
          xcodebuild \
            -project AIConsumptionWidget.xcodeproj \
            -scheme AIConsumptionWidget \
            -configuration Release \
            -sdk macosx \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app
        run: |
          mkdir -p dist
          APP_PATH=$(ls -dt ~/Library/Developer/Xcode/DerivedData/AIConsumptionWidget-*/Build/Products/Release/AIConsumptionWidget.app | head -n 1)
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/AIConsumptionWidget-macOS.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIConsumptionWidget-macOS
          path: dist/AIConsumptionWidget-macOS.zip

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/AIConsumptionWidget-macOS.zip
